name: "Multizone Climate"
version: "0.1.7-dev"
slug: multizone_climate
description: "Advanced multi-zone HVAC management - Home Assistant add-on for intelligent zone control"
arch:
  - amd64
  - armv7
  - aarch64
url: "https://github.com/Chester929/ha_multizone_climate"
startup: services
boot: auto
init: false
host_network: true

options:
  integration:
    coordinator_interval: 30
    backend_port: 8080
  redis:
    mode: bundled
    bundled_port: 6380
    host: "127.0.0.1"
    port: 6379
    password: ""
  logic:
    log_level: "info"

schema:
  integration:
    coordinator_interval: int(5,300)?
    backend_port: port?
  redis:
    mode: list(bundled|external)
    bundled_port: port?
    host: str?
    port: port?
    password: password?
  logic:
    log_level: list(debug|info|warning|error)

ports:
  8080/tcp: 8080

ports_description:
  8080/tcp: "Backend API"

map:
  - homeassistant_config:rw

homeassistant_api: true

ingress: false
