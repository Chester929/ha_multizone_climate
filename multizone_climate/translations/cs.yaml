configuration:
  integration:
    name: "Nastavení integrace"
    description: "Nastavení připojení vlastní integrace"
  integration.coordinator_interval:
    name: "Interval koordinátoru"
    description: "Jak často (v sekundách) integrace dotazuje backend na příkazy k provedení. Nižší hodnoty poskytují rychlejší odezvu, ale zvyšují zatížení systému."
  integration.backend_port:
    name: "Backend port"
    description: "Číslo portu pro backend API server. Ujistěte se, že tento port není používán jinými službami."
  
  redis:
    name: "Nastavení Redis"
    description: "Připojení a konfigurace Redis"
  redis.mode:
    name: "Redis režim"
    description: "Použít vestavený Redis kontejner nebo se připojit k externímu Redis serveru"
  redis.host:
    name: "Redis hostitel"
    description: "Název hostitele nebo IP adresa Redis serveru (vyžadováno, když je režim externí)"
  redis.port:
    name: "Redis port"
    description: "Číslo portu Redis serveru (vyžadováno, když je režim externí)"
  redis.password:
    name: "Redis heslo"
    description: "Heslo pro autentizaci Redis (volitelné, doporučeno pro externí servery)"
  
  logic:
    name: "Nastavení logiky"
    description: "Konfigurace kontejneru backend logiky"
  logic.log_level:
    name: "Úroveň logování"
    description: "Úroveň podrobnosti logování. Použijte 'debug' pro podrobné řešení problémů, 'info' pro normální provoz."

network:
  8080/tcp: "Backend API port pro komunikaci mezi doplňkem a vlastní integrací"
