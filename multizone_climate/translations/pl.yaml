configuration:
  integration:
    name: "Ustawienia integracji"
    description: "Ustawienia połączenia niestandardowej integracji"
  integration.coordinator_interval:
    name: "Interwał koordynatora"
    description: "Jak często (w sekundach) integracja odpytuje backend o polecenia do wykonania. Niższe wartości zapewniają szybszą odpowiedź, ale zwiększają obciążenie systemu."
  integration.backend_port:
    name: "Port backendu"
    description: "Numer portu dla serwera API backendu. Upewnij się, że ten port nie jest używany przez inne usługi."
  
  redis:
    name: "Ustawienia Redis"
    description: "Połączenie i konfiguracja Redis"
  redis.mode:
    name: "Tryb Redis"
    description: "Użyj wbudowanego kontenera Redis lub połącz się z zewnętrznym serwerem Redis"
  redis.host:
    name: "Host Redis"
    description: "Nazwa hosta lub adres IP serwera Redis (wymagane, gdy tryb jest zewnętrzny)"
  redis.port:
    name: "Port Redis"
    description: "Numer portu serwera Redis (wymagane, gdy tryb jest zewnętrzny)"
  redis.password:
    name: "Hasło Redis"
    description: "Hasło uwierzytelniania Redis (opcjonalne, zalecane dla serwerów zewnętrznych)"
  
  logic:
    name: "Ustawienia logiki"
    description: "Konfiguracja kontenera logiki backendu"
  logic.log_level:
    name: "Poziom logowania"
    description: "Poziom szczegółowości logowania. Użyj 'debug' do szczegółowego rozwiązywania problemów, 'info' do normalnej pracy."

network:
  8080/tcp: "Port API backendu do komunikacji między dodatkiem a niestandardową integracją"
