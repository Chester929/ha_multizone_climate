configuration:
  integration:
    name: "Integration Settings"
    description: "Settings for the custom integration connection"
  integration.coordinator_interval:
    name: "Coordinator Interval"
    description: "How often (in seconds) the integration polls for commands to execute. Lower values provide faster response but increase system load."
  integration.backend_port:
    name: "Backend Port"
    description: "Port number for the backend API server. Ensure this port is not used by other services."
  
  redis:
    name: "Redis Settings"
    description: "Redis connection and configuration"
  redis.mode:
    name: "Redis Mode"
    description: "Use bundled Redis container or connect to external Redis server"
  redis.bundled_port:
    name: "Bundled Redis Port"
    description: "Port for bundled Redis server (default: 6380)"
  redis.host:
    name: "Redis Host"
    description: "Redis server hostname or IP address (default: 127.0.0.1)"
  redis.port:
    name: "Redis Port"
    description: "Redis server port number (default: 6379)"
  redis.password:
    name: "Redis Password"
    description: "Redis authentication password (optional, recommended for external servers)"
  
  logic:
    name: "Logic Settings"
    description: "Backend logic container configuration"
  logic.log_level:
    name: "Log Level"
    description: "Logging verbosity level. Use 'debug' for detailed troubleshooting, 'info' for normal operation."

network:
  8080/tcp: "Backend API port for communication between add-on and custom integration"
