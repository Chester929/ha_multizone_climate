version: '3.8'

services:
  # Test services that mirror production
  logic-test:
    build:
      context: ../../logic
      dockerfile: Dockerfile
    container_name: multizone-logic-test
    environment:
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - LOG_LEVEL=debug
      - HTTP_PORT=8080
    ports:
      - "18080:8080"
    depends_on:
      redis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - test-network

  redis-test:
    image: redis:7-alpine
    container_name: multizone-redis-test
    command: redis-server --appendonly yes --notify-keyspace-events KEA
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - test-network

  # Test runner container
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: multizone-test-runner
    environment:
      - LOGIC_URL=http://logic-test:8080
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
    depends_on:
      logic-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    volumes:
      - ./tests:/tests:ro
      - ./results:/results
    networks:
      - test-network
    command: ["./run-tests.sh"]

networks:
  test-network:
    name: multizone-test-network
