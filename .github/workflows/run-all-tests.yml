---
name: Run All Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: run-all-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_dev.txt

      - name: Run black (code formatting check)
        run: |
          black --check custom_components tests

      - name: Run pylint
        run: |
          pylint custom_components

      - name: Run mypy (type checking)
        continue-on-error: true
        run: |
          mypy custom_components

      - name: Run pytest
        run: |
          pytest tests/ -v --cov=custom_components.multizone_climate --cov-report=term-missing --cov-report=xml

      - name: Upload coverage reports
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        working-directory: ./logic
        run: go mod download

      - name: Run tests
        working-directory: ./logic
        run: go test -v ./...

      - name: Run linter
        working-directory: ./logic
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"

  build-containers:
    name: Build Docker Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Logic Container
        uses: docker/build-push-action@v5
        with:
          context: ./logic
          file: ./logic/Dockerfile
          push: false
          tags: multizone-logic:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [go-tests, build-containers]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << EOF
          REDIS_PASSWORD=test_password
          LOG_LEVEL=info
          EOF

      - name: Start services
        run: docker-compose up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          sleep 30

      - name: Check Logic Container health
        run: |
          curl -f http://localhost:8080/health || exit 1

      - name: Show logs
        if: failure()
        run: docker-compose logs

      - name: Stop services
        if: always()
        run: docker-compose down -v

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [python-tests, go-tests, integration-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.python-tests.result }}" == "success" ] && \
             [ "${{ needs.go-tests.result }}" == "success" ] && \
             [ "${{ needs.integration-tests.result }}" == "success" ]; then
            echo "✅ All tests passed!"
            exit 0
          else
            echo "❌ Some tests failed!"
            echo "Python tests: ${{ needs.python-tests.result }}"
            echo "Go tests: ${{ needs.go-tests.result }}"
            echo "Integration tests: ${{ needs.integration-tests.result }}"
            exit 1
          fi
