name: Build and Test

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  test-logic:
    name: Test Logic Container
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      
      - name: Download dependencies
        working-directory: ./logic
        run: go mod download
      
      - name: Run tests
        working-directory: ./logic
        run: go test -v ./...
      
      - name: Run linter
        working-directory: ./logic
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"

  test-frontend:
    name: Test Frontend Container
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build
        working-directory: ./frontend
        run: npm run build

  build-containers:
    name: Build Docker Containers
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Logic Container
        uses: docker/build-push-action@v5
        with:
          context: ./logic
          file: ./logic/Dockerfile
          push: false
          tags: multizone-logic:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: multizone-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build MQTT Middleware Container
        uses: docker/build-push-action@v5
        with:
          context: ./mqtt-middleware
          file: ./mqtt-middleware/Dockerfile
          push: false
          tags: multizone-mqtt:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [test-logic, test-frontend, build-containers]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Create .env file
        run: |
          cat > .env << EOF
          REDIS_PASSWORD=test_password
          LOG_LEVEL=info
          EOF
      
      - name: Start services
        run: docker-compose up -d
      
      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          sleep 30
      
      - name: Check Logic Container health
        run: |
          curl -f http://localhost:8080/health || exit 1
      
      - name: Check Frontend health
        run: |
          curl -f http://localhost:8099/health || exit 1
      
      - name: Show logs
        if: failure()
        run: docker-compose logs
      
      - name: Stop services
        if: always()
        run: docker-compose down -v
