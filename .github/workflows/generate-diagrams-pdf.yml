---
name: Generate Diagrams PDF

on:
  push:
    branches:
      - master
      - dev
    paths:
      - 'DIAGRAMS.md'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: generate-diagrams-pdf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # Required to commit and push the PDF

jobs:
  generate-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mermaid-cli
        run: npm install @mermaid-js/mermaid-cli

      - name: Install PDF merge tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Generate PDF from DIAGRAMS.md
        id: generate
        run: |
          echo "Generating PDF from DIAGRAMS.md..."
          npx mmdc -i DIAGRAMS.md -o diagrams.pdf -t dark -b transparent -p puppeteer-config.json
          echo "PDF files generated"
          
          # mmdc creates separate PDF files (diagrams-1.pdf, diagrams-2.pdf, etc.)
          # We need to merge them into a single diagrams.pdf
          echo "Merging PDF files..."
          
          # Find all individual PDF files and store in array
          shopt -s nullglob
          pdf_files=(diagrams-*.pdf)
          shopt -u nullglob
          
          # Check if any individual PDF files exist
          if [ ${#pdf_files[@]} -gt 0 ]; then
            # Remove any existing diagrams.pdf from mmdc (which may be incomplete)
            rm -f diagrams.pdf
            
            # Sort files numerically
            IFS=$'\n' sorted_files=($(sort -V <<<"${pdf_files[*]}"))
            unset IFS
            
            # Merge PDFs
            pdfunite "${sorted_files[@]}" diagrams-merged.pdf
            
            # Move merged PDF to final location
            mv diagrams-merged.pdf diagrams.pdf
            
            echo "PDF merged successfully!"
            
            # Clean up individual PDF files
            rm -f "${pdf_files[@]}"
          else
            echo "No individual PDF files found to merge"
          fi
          
          echo "PDF generation complete!"

      - name: Validate PDF artifact
        id: validate
        run: |
          if [ ! -f diagrams.pdf ]; then
            echo "Error: PDF file was not generated"
            exit 1
          fi
          if [ ! -s diagrams.pdf ]; then
            echo "Error: PDF file is empty"
            exit 1
          fi
          echo "PDF validation successful"

      - name: Upload artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: diagrams-pdf
          path: diagrams.pdf
          retention-days: 90

      - name: Commit and push PDF
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          email="github-actions[bot]@users.noreply.github.com"
          git config --local user.email "$email"
          git config --local user.name "github-actions[bot]"

          # Add and commit the PDF if it has changed
          git add diagrams.pdf

          # Only commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-generate diagrams PDF [skip ci]"
            git push origin "${{ github.ref_name }}"
            echo "PDF committed and pushed to repository"
          else
            echo "No changes to PDF, skipping commit"
          fi
