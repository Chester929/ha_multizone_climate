name: "Multizone Climate"
version: "2.0.0"
slug: multizone_climate
description: "Advanced multi-zone HVAC management with containerized microservices architecture"
arch:
  - amd64
  - armv7
  - aarch64
url: "https://github.com/Chester929/ha_multizone_climate"
startup: services
boot: auto
init: false
host_network: true

options:
  redis:
    mode: bundled
    password: ""
  mqtt:
    enabled: false
    broker: "homeassistant.local"
    port: 1883
    username: ""
    password: ""
  logic:
    log_level: "info"
  frontend:
    port: 8099

schema:
  redis:
    mode: list(bundled|external)
    host: str?
    port: port?
    password: password?
  mqtt:
    enabled: bool
    broker: str?
    port: port?
    username: str?
    password: password?
  logic:
    log_level: list(debug|info|warning|error)
  frontend:
    port: port

ports:
  8099/tcp: 8099

ports_description:
  8099/tcp: "Frontend Web Interface"

services:
  - mqtt:want

ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:thermostat-box
panel_title: Multizone Climate

image: "ghcr.io/chester929/ha-multizone-climate-{arch}"
