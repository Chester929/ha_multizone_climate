name: "Multizone Climate"
version: "2.0.0"
slug: multizone_climate
description: "Advanced multi-zone HVAC management - Home Assistant add-on for intelligent zone control"
arch:
  - amd64
  - armv7
  - aarch64
url: "https://github.com/Chester929/ha_multizone_climate"
startup: services
boot: auto
init: false
host_network: true

options:
  integration:
    coordinator_interval: 30
    backend_port: 8080
  redis:
    mode: bundled
    password: ""
  logic:
    log_level: "info"
  frontend:
    port: 8099

schema:
  integration:
    coordinator_interval: int(5-300)?
    backend_port: port?
  redis:
    mode: list(bundled|external)
    host: str?
    port: port?
    password: password?
  logic:
    log_level: list(debug|info|warning|error)
  frontend:
    port: port

ports:
  8099/tcp: 8099

ports_description:
  8099/tcp: "Frontend Web Interface"

ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:thermostat-box
panel_title: Multizone Climate

image: "ghcr.io/chester929/ha-multizone-climate-{arch}"
